name: Publish dated OTA release

on:
  push:
    tags:
      - 'ota-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing OTA tag to verify, or new tag to publish
        required: true
        type: string

env:
  TARGET_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag, payload, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="$TARGET_TAG"
          date="${tag#ota-}"
          [[ "$date" =~ ^[0-9]{8}(-r[1-9][0-9]*|-compat)?$ ]]
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          git checkout --detach "$tag"
          git fetch origin main
          git merge-base --is-ancestor "${tag}^{commit}" origin/main
          archive="$date/darkosupdate${date}.zip"
          test -f "$archive"
          test -f "$date/README.md"
          test -f "$date/SHA256SUMS"
          (cd "$date" && sha256sum -c SHA256SUMS)
          python3 tools/validate-current-ota.py "$archive"
      - name: Create GitHub Release with device payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$TARGET_TAG"
          date="${tag#ota-}"
          assets=("$date/darkosupdate${date}.zip" "$date/SHA256SUMS")
          if [ -f "$date/apply_portmaster_compat.py" ]; then
            assets+=("$date/apply_portmaster_compat.py")
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            download_dir="$(mktemp -d)"
            trap 'rm -rf "$download_dir"' EXIT
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$download_dir"
            for asset in "${assets[@]}"; do
              cmp -- "$asset" "$download_dir/$(basename "$asset")"
            done
            echo "Existing release $tag has the exact validated payload assets."
          else
            gh release create "$tag" \
              "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "dArkOSRE-R36 OTA $date" \
              --notes-file "$date/README.md"
          fi
