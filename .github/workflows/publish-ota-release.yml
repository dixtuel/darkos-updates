name: Publish dated OTA release

on:
  push:
    tags:
      - 'ota-*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag, payload, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          date="${tag#ota-}"
          [[ "$date" =~ ^[0-9]{8}(-r[1-9][0-9]*)?$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          archive="$date/darkosupdate${date}.zip"
          test -f "$archive"
          test -f "$date/README.md"
          test -f "$date/SHA256SUMS"
          (cd "$date" && sha256sum -c SHA256SUMS)
      - name: Create GitHub Release with device payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date="${GITHUB_REF_NAME#ota-}"
          gh release create "$GITHUB_REF_NAME" \
            "$date/darkosupdate${date}.zip" \
            "$date/SHA256SUMS" \
            --title "dArkOSRE-R36 OTA $date" \
            --notes-file "$date/README.md"
